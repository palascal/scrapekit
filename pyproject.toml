[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scrapekit"
version = "0.1.0"
description = "Shared scraping engine for saxbot, AudiTT, and similar listing monitors"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "playwright>=1.40.0",
  "requests>=2.31.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["scrapekit*"]
